name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: taciturnaxolotl/dots/.github/workflows/deploy-service.yml@main
    with:
      service: botme
      # Moved off terebithia (2 cores) to prattle (8). The reusable workflow
      # still defaults to terebithia, so this has to say so explicitly.
      host: prattle
      install_command: "env UV_PYTHON_DOWNLOADS=never uv sync --frozen"
      health_url: https://botme.dunkirk.sh/health
      db_path: /var/lib/botme/data/botme.db
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
