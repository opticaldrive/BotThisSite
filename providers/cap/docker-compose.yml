services:
  cap:
    # Pinned to match the widget pin in providers.py: a key minted here on
    # 3.1.12+ is hashwx, which only widget 0.1.58+ can solve.
    image: tiago2/cap:3.1.14
    container_name: cap
    ports:
      - "3069:3000"
    environment:
      ADMIN_KEY: ${CAP_ADMIN_KEY:?Add CAP_ADMIN_KEY to the repository .env file}
      REDIS_URL: redis://valkey:6379
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9-alpine
    container_name: cap-valkey
    volumes:
      - valkey-data:/data
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  valkey-data:
