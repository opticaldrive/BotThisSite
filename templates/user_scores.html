<!DOCTYPE html>
<html>
<head>
    <title>BotThisSite User Score Graphs</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; }
        #chart-wrap { position: relative; height: 60vh; }
        .controls { margin-bottom: 1rem; }
    </style>
</head>
<body>
    <h1>User scores over time</h1>
    <p><a href="/data">captcha solves</a> and <a href="/leaderboard">leaderboard</a> and <a href="/">home</a></p>

    <div class="controls">
        <label>Bucket:
            <select id="bucket">
                <option value="day">day</option>
                <option value="hour" selected>hour</option>
                <option value="5min">5min</option>
            </select>
        </label>
        <label>Range:
            <select id="range">
                <option value="hour">hour</option>
                <option value="day" selected>day</option>
                <option value="3day">3day</option>
                <option value="7day">7day</option>
                <option value="30day">30day</option>
                <option value="all">all</option>
            </select>
        </label>
    </div>

    <div id="chart-wrap">
        <canvas id="userScoresChart"></canvas>
    </div>

    <script>
        function color(i, alpha) {
            const hue = (i * 137.508) % 360;
            return `hsl(${hue} 70% 55% / ${alpha})`;
        }

        let chart = null;
        function syncUrl() {
            const p = new URLSearchParams({ bucket: bucketSel.value, range: rangeSel.value });
            history.replaceState(null, "", `?${p}`);
        }
        async function draw() {
            const bucket = document.getElementById("bucket").value;
            const range = document.getElementById("range").value;
            const res = await fetch(`/api/graphs/user-scores?bucket=${bucket}&range=${range}`);
            const { labels, series } = await res.json();
            syncUrl()
            const datasets = series.map((s, i) => ({
                label: s.name,
                data: s.counts,
                borderColor: color(i, 1),
                backgroundColor: color(i, 0.15),
                tension: 0.3,
                // pointRadius: 2,
                fill: false,
            }));

            if (chart) chart.destroy();
            chart = new Chart(document.getElementById("userScoresChart"), {
                type: "line",
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: "index", intersect: false },
                    plugins: {
                        title: { display: true, text: `Cumulative user score (${range})` },
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { precision: 0 } },
                    },
                    animation: false,
                    normalized: true,
                    elements: {
                        point: {
                            radius: 0,
                            hoverRadius: 3,
                        },
                    },
                },
            });
        }
        const params = new URLSearchParams(location.search);
        const rangeSel = document.getElementById("range");
        const bucketSel = document.getElementById("bucket");

        if ([...bucketSel.options].some(o => o.value === params.get("bucket")))
            bucketSel.value = params.get("bucket");
        if ([...rangeSel.options].some(o => o.value === params.get("range")))
            rangeSel.value = params.get("range");
        document.getElementById("bucket").addEventListener("change", draw);
        document.getElementById("range").addEventListener("change", draw);
        draw();
    </script>
</body>
</html>
